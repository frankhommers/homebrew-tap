name: Sync tmux formula

# Our tmux formula is not a copy of homebrew-core but is derived from it.
# This workflow fetches core's version, injects our macOS patch, actually
# builds it, verifies the Info.plist ended up in the binary, and only then
# commits.
#
# As a result new tmux versions, changed dependencies and adjusted configure
# flags are picked up automatically. If core changes so much that the injection
# no longer fits, this workflow fails and you get a notification instead of a
# silent divergence.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday morning
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-tmux-formula.py"
      - ".github/workflows/sync-tmux-formula.yml"

permissions:
  contents: write

concurrency:
  group: sync-tmux-formula
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate formula from homebrew-core
        id: gen
        run: |
          python3 scripts/generate-tmux-formula.py
          if git diff --quiet -- Formula/tmux.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change compared to what is committed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- Formula/tmux.rb
          fi

      - name: Check style
        if: steps.gen.outputs.changed == 'true'
        continue-on-error: true
        run: brew style Formula/tmux.rb

      - name: Build and verify
        if: steps.gen.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # The runner may ship a preinstalled tmux; it gets in the way.
          brew uninstall --ignore-dependencies tmux 2>/dev/null || true

          # Since 4.7 Homebrew no longer accepts a bare formula path
          # ("Homebrew requires formulae to be in a tap"), so we tap ourselves
          # and drop the freshly generated formula in there.
          brew tap frankhommers/tap
          TAP_DIR="$(brew --repository frankhommers/tap)"
          cp Formula/tmux.rb "$TAP_DIR/Formula/tmux.rb"

          brew install --build-from-source frankhommers/tap/tmux

          BIN="$(brew --prefix)/bin/tmux"
          echo "--- checking $BIN ---"

          otool -l "$BIN" | grep -q "__info_plist" \
            || { echo "ERROR: __info_plist missing from the binary"; exit 1; }

          codesign -dvvv "$BIN" 2>&1 | grep -q "Identifier=com.github.tmux" \
            || { echo "ERROR: wrong or missing bundle identifier"; exit 1; }

          "$BIN" -V
          echo "OK: patch is present"

      - name: Commit
        if: steps.gen.outputs.changed == 'true'
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'tmux-[0-9][^/"]*\.tar\.gz' Formula/tmux.rb | head -1 | sed 's/tmux-//;s/\.tar\.gz//')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tmux.rb
          git commit -m "chore: sync tmux formula with homebrew-core (${VERSION})"
          git push
